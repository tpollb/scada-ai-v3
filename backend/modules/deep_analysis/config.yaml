name: deep_analysis
version: 0.3.0
description: Глубокий анализ данных — аномалии, корреляции, статистика
enabled: true
anomaly_detection:
  contamination: 0.06
  n_estimators: 100
  spike_threshold: 2.0
  dip_threshold: 2.0
  drift_min_duration: 3
  drift_min_r_squared: 0.4
  drift_min_relative_change: 0.03
  plateau_tolerance: 0.02
  local_window: 24
  significant_dip_ratio: 0.3
  zero_threshold_ratio: 0.05
correlations:
  resample_freq: 5min
  pearson_threshold: 0.3
  max_lag: 50
visualization:
  max_points: 1500
  anomaly_point_radius: 6
  drift_line_width: 2
colors:
  spike: '#ef4444'
  dip: '#3b82f6'
  drift: '#f59e0b'
  noise: '#9ca3af'
